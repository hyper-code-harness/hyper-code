name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  # Opt-in to Node 24 for JS actions (cache, checkout) ahead of the June 2026 default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel a running CI on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test + tsc
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: paradedb/paradedb:latest-pg18
        env:
          POSTGRES_USER: hyper
          POSTGRES_PASSWORD: hyper
          POSTGRES_DB: hyper
        ports:
          - 54393:5432
        options: >-
          --health-cmd "pg_isready -U hyper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The suite creates an isolated pg_temp connection per test context. The
      # stock Postgres limit (100) is too low for the full suite, whose pools
      # are closed by the Bun test preload at shutdown.
      - name: Raise Postgres connection limit
        run: |
          container="$(docker ps --filter ancestor=paradedb/paradedb:latest-pg18 --format '{{.ID}}' | head -1)"
          docker exec "$container" psql -U hyper -d hyper -c "ALTER SYSTEM SET max_connections = 500"
          docker restart "$container"
          until docker exec "$container" pg_isready -U hyper -d hyper; do sleep 1; done
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ambient types
        # src/ctx_ns.d.ts is generated, not committed: its import paths point at
        # whatever is mounted on the machine that wrote it. Boot does this in
        # development; CI has to do it before tsc can see ctx.fns at all.
        run: bun script/cli.ts types

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Run tests
        run: bun test --timeout 15000

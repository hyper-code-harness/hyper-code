<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucide Icons</title><style>body{margin:0;background:#111827;color:#e5e7eb;font:14px system-ui}header{position:sticky;top:0;background:#111827;padding:20px;border-bottom:1px solid #334155}h1{font-size:20px;margin:0 0 14px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #475569;border-radius:10px;background:#1f2937;color:white;font:inherit}#count{margin-top:10px;color:#94a3b8}main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}button{cursor:pointer;color:inherit;background:#1f2937;border:1px solid #334155;border-radius:10px;padding:16px 6px;display:flex;align-items:center;flex-direction:column;gap:12px;font:12px system-ui}button:hover,button:focus{border-color:#a78bfa;background:#312e55}button svg{width:30px;height:30px}button span{overflow-wrap:anywhere}footer{padding:16px;color:#94a3b8}dialog{max-width:440px;width:80%;background:#1f2937;color:#e5e7eb;border:1px solid #475569;border-radius:16px}dialog::backdrop{background:#0009}#preview{display:flex;justify-content:center;padding:24px}#preview svg{width:64px;height:64px}textarea{width:100%;box-sizing:border-box;height:130px;background:#111827;color:#cbd5e1;margin:12px 0}#actions{display:flex;gap:10px}#more{margin:0 auto}</style><header><h1>Lucide · каталог иконок</h1><input id="q" type="search" placeholder="Поиск по английским названиям и тегам: shapes, music, heart…" aria-label="Поиск иконок"><div id="count" role="status"></div></header><main id="grid"></main><button id="more">Показать ещё</button><footer>Lucide · ISC / Feather · MIT · локальный каталог</footer><dialog id="detail"><h2 id="name"></h2><div id="preview"></div><p id="tags"></p><textarea id="code" readonly aria-label="SVG код"></textarea><div id="actions"><button id="download">Скачать SVG</button><button id="close">Закрыть</button></div></dialog><script>
const rows=__ICON_DATA__;const $=id=>document.getElementById(id);let matches=rows,limit=120,selected=null;
function render(){ $('grid').replaceChildren();for(const row of matches.slice(0,limit)){const b=document.createElement('button');b.innerHTML=row.svg;const label=document.createElement('span');label.textContent=row.name;b.append(label);b.onclick=()=>{selected=row;$('name').textContent=row.name;$('tags').textContent=row.tags.join(', ');$('preview').innerHTML=row.svg;$('code').value=row.svg;$('detail').showModal();};$('grid').append(b);}$('count').textContent=`Найдено ${matches.length} из ${rows.length}`;$('more').hidden=limit>=matches.length;}
function search(){const q=$('q').value.trim().toLowerCase(),terms=q.split(/[\s_-]+/).filter(Boolean);matches=rows.map(row=>{const words=row.name.split('-'),tags=row.tags.map(t=>t.toLowerCase());const scores=terms.map(t=>words.includes(t)?10:tags.includes(t)?6:row.name.includes(t)?3:tags.some(x=>x.includes(t))?1:0);return {row,score:scores.every(s=>s>0)?scores.reduce((a,b)=>a+b,0)+(row.name===q?100:0):-1};}).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score||a.row.name.localeCompare(b.row.name)).map(x=>x.row);limit=120;render();}
$('q').oninput=search;$('more').onclick=()=>{limit+=120;render();};$('close').onclick=()=>$('detail').close();$('code').onclick=()=>$('code').select();$('download').onclick=()=>{if(!selected)return;const url=URL.createObjectURL(new Blob([selected.svg],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=selected.name+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></html>
